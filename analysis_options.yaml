analyzer:
  errors:
    invalid_return_type_for_catch_error: ignore
    use_build_context_synchronously: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    avoid_print: false
    prefer_single_quotes: true
    always_use_package_imports: true
