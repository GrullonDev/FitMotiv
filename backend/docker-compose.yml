services:
  postgres:
    image: postgres:16-alpine
    container_name: fitmotiv-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fitmotiv
      POSTGRES_USER: fitmotiv_user
      POSTGRES_PASSWORD: fitmotiv_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
